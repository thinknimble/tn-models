name: Publish npm package
on:
  push:
    branches:
      - "main"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for changesets to create tags
  pull-requests: write # Required for changesets to open the release PR

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; setup-node ships npm 10.
      # Pin to npm 11 (npm 12 requires Node 22+, runner is Node 20).
      - run: npm install -g npm@^11
      - run: pnpm install --frozen-lockfile
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          # Auth to npm is via OIDC (Trusted Publishing) — no NPM_TOKEN needed.
          # GITHUB_TOKEN still required for changesets to open the release PR and push tags.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
